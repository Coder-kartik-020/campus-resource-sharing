{% extends 'base.html' %}{% block title %}Sell an item — CampusMarket{% endblock %}{% block content %}<div class="form-page"><a class="back-link" href="{{ url_for('home') }}">← Home</a><div class="form-panel"><h1>Post an item</h1><p>Give your pre-loved item a new home on campus.</p><form method="post" enctype="multipart/form-data" class="form-stack"><label>Item title<input name="title" placeholder="e.g. Dell laptop, semester notes" required></label><label>Category<select name="category" required><option value="">Choose category</option>{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></label><label>Price (₹)<input type="number" name="price" min="0" step="1" placeholder="Enter price (0 for free)" required></label><label>Condition<select name="condition"><option>Like new</option><option>Good</option><option>Fair</option><option>Needs repair</option></select></label><label>Description<textarea name="description" rows="4" placeholder="Details, specifications, reason for selling..." required></textarea></label><label>Location<input id="locationInput" name="location" placeholder="Campus / area" required><button class="location-btn" type="button" id="locateBtn">Use my location</button></label><label>Product photo<input name="image" type="file" accept="image/png,image/jpeg,image/webp"></label><button class="btn full" type="submit">Publish listing</button></form></div></div>{% endblock %}
