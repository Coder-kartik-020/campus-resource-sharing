{% extends 'base.html' %}{% block title %}Account — CampusMarket{%endblock%}{%block content%}<section class="form-page"><div class="form-panel"><div class="account-head"><div class="seller-avatar">{{ user.name[0]|upper }}</div><div><h1>{{ user.name }}</h1><p class="muted">{{ user.email }}</p></div></div><h2>Edit profile</h2><form method="post" action="{{ url_for('account_update') }}" class="form-stack"><label>Name<input name="name" value="{{ user.name }}" required></label><label>Phone<input name="phone" value="{{ user.phone or '' }}"></label><label>College<input name="college" value="{{ user.college or '' }}"></label><label>Location<input name="location" value="{{ user.location or '' }}"></label><button class="btn full">Save profile</button></form><a class="btn secondary full logout" href="{{ url_for('logout') }}">Logout</a></div></section>{%endblock%}
