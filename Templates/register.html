{% extends 'base.html' %}{% block title %}Create Account — CampusMarket{% endblock %}{% block content %}<section class="auth-wrap"><div class="auth-card"><div class="auth-logo">🎓</div><h1>Join CampusMarket</h1><p>Trade with people from your campus</p><form method="post" class="form-stack"><label>Full name<input name="name" placeholder="Your name" required></label><label>Email<input name="email" type="email" placeholder="Email address" required></label><label>Phone number<input name="phone" type="tel" placeholder="10-digit number"></label><label>College / University<input name="college" placeholder="College name"></label><label>Campus / Area<input name="location" placeholder="Area or campus location"></label><label>Password<input name="password" type="password" minlength="6" placeholder="At least 6 characters" required></label><button class="btn full" type="submit">Create account</button></form><p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Login</a></p></div></section>{% endblock %}
